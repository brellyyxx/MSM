name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Build Unsigned IPA via Xcode
        run: |
          # Prüfen, ob der ios Ordner da ist
          if [ ! -d "ios" ]; then
            echo "Error: ios folder was not generated!"
            exit 1
          fi

          cd ios
          
          # Workspace ermitteln mit Fallback auf Projektdatei falls kein Workspace da ist
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            WORKSPACE=$(ls -d *.xcworkspace)
            BUILD_FLAG="-workspace"
            TARGET="$WORKSPACE"
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          else
            WORKSPACE=$(ls -d *.xcodeproj)
            BUILD_FLAG="-project"
            TARGET="$WORKSPACE"
            SCHEME=$(xcodebuild -list -project "$WORKSPACE" | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          fi

          echo "Using Target: $TARGET"
          echo "Using Scheme: $SCHEME"

          # Ordner für den Build erstellen
          mkdir -p build/Payload
          
          # Projekt kompilieren ohne Signierung
          xcodebuild "$BUILD_FLAG" "$TARGET" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # App-Bundle in den Payload-Ordner schieben
          cp -r "build/App.xcarchive/Products/Applications/"*.app build/Payload/
          
          # In IPA verpacken
          cd build
          zip -r ../../myapp-unsigned.ipn Payload
          cd ../..
          
          mv myapp-unsigned.ipn myapp-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: myapp-unsigned.ipa
