name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild & CocoaPods
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
          cd ..

      - name: Build Unsigned IPA via Xcode
        run: |
          if [ ! -d "ios" ]; then
            echo "Error: ios folder was not generated!"
            exit 1
          fi

          cd ios

          if ls *.xcworkspace 1> /dev/null 2>&1; then
            WORKSPACE=$(ls -d *.xcworkspace)
            BUILD_FLAG="-workspace"
            TARGET="$WORKSPACE"
          else
            WORKSPACE=$(ls -d *.xcodeproj)
            BUILD_FLAG="-project"
            TARGET="$WORKSPACE"
          fi

          SCHEME=$(basename "$WORKSPACE" | sed 's/\.[^.]*$//')

          echo "Using Target: $TARGET"
          echo "Using Scheme: $SCHEME"

          mkdir -p build/Payload

          xcodebuild "$BUILD_FLAG" "$TARGET" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          cp -r "build/App.xcarchive/Products/Applications/"*.app build/Payload/

          cd build
          zip -r ../../myapp-unsigned.ipn Payload
          cd ../..

          mv myapp-unsigned.ipn myapp-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: myapp-unsigned.ipa
