name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Lässt sich manuell im GitHub-Tab triggern

jobs:
  build-ios:
    runs-on: macos-14 # Nutzt macOS Sonoma (aktuell stabil für Xcode)
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI (optional, aber gut für Expo prebuild)
        run: npm install -g eas-cli

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Build Unsigned IPA via Xcode
        run: |
          cd ios
          
          # Workspace/Project ermitteln
          WORKSPACE=$(ls -d *.xcworkspace)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          echo "Using Workspace: $WORKSPACE"
          echo "Using Scheme: $SCHEME"

          # Ordner für den Build erstellen
          mkdir -p build/Payload
          
          # Projekt kompilieren (Generic iOS Device, ohne Signierung erzwingen)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # App-Bundle in den Payload-Ordner schieben
          cp -r "build/App.xcarchive/Products/Applications/"*.app build/Payload/
          
          # In IPA verpacken
          cd build
          zip -r ../../myapp-unsigned.ipn Payload
          cd ../..
          
          # Umbenennen in .ipa
          mv myapp-unsigned.ipn myapp-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: myapp-unsigned.ipa
