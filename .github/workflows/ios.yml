name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform ios

      - name: Find iOS project
        run: |
          echo "=== iOS files ==="
          find ios -maxdepth 2 -type f | sort
          echo "=== Workspaces ==="
          find ios -maxdepth 1 -name "*.xcworkspace"
          echo "=== Projects ==="
          find ios -maxdepth 1 -name "*.xcodeproj"

      - name: Build unsigned app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found, using .xcodeproj"
            BUILD_TARGET="-project $PROJECT"
          else
            echo "Using workspace: $WORKSPACE"
            BUILD_TARGET="-workspace $WORKSPACE"
          fi

          SCHEME=$(basename "$PROJECT" .xcodeproj)

          echo "Project: $PROJECT"
          echo "Scheme: $SCHEME"

          xcodebuild \
            $BUILD_TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "No .app found!"
            exit 1
          fi

          echo "Found app: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -r MSM.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MSM-iOS
          path: MSM.ipa
