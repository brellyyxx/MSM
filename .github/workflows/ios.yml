name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform ios

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "$(basename ios/*.xcodeproj .xcodeproj)" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r MSM.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MSM-iOS
          path: MSM.ipa
